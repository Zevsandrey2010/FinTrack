{% extends "finance/base.html" %}
{% block title %}Add Budget | FinTrack{% endblock %}
{% block content %}
<header class="topbar"><div><div class="eyebrow">Set a spending limit</div><h1>Add Monthly Budget</h1></div></header>
<div class="card form-card">
<form method="post">{% csrf_token %}
  {% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="sub" style="color:#c33">{{ field.errors }}</div>{% endif %}</div>{% endfor %}
  <button type="submit">Save budget</button> <a class="btn secondary" href="{% url 'dashboard' %}">Cancel</a>
</form>
</div>
{% endblock %}
